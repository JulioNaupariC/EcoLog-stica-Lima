# SonarCloud — ECL-65 / EN-009, parte A (análisis en CI).
# El análisis lo ejecuta el job «Quality / SonarCloud» de .github/workflows/ci.yml;
# el Automatic Analysis de SonarCloud está desactivado. El token llega por el
# secreto SONAR_TOKEN y nunca se escribe en este archivo.

sonar.organization=julionauparic
sonar.projectKey=JulioNaupariC_EcoLog-stica-Lima
sonar.projectName=EcoLog-stica-Lima

# --- Código de la aplicación ------------------------------------------------
# Solo el código que se despliega: API FastAPI y frontend React.
sonar.sources=backend/app,frontend/src
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# --- Pruebas -------------------------------------------------------------------
# Pruebas del backend (unitarias e integración) y pruebas Vitest, que conviven con
# el código en frontend/src. Se analizan como pruebas y no como código de producción.
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# --- Exclusiones justificadas ---------------------------------------------------
# - Pruebas fuera de sources: frontend/src también es carpeta de pruebas; sin esta
#   exclusión, los *.test.ts(x) y el setup de Vitest contarían como código de la app.
# - docs/** y **/evidencias/**: documentación y evidencias generadas (JSON, XML,
#   capturas, resultados de carga); no son código ejecutable.
# - backend/loadtest/**: herramienta de pruebas de carga (ST-035), no se despliega
#   con la API. backend/scripts/**: utilidades locales y de demo, fuera de la app.
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,docs/**,**/evidencias/**,backend/loadtest/**,backend/scripts/**

# Las migraciones de Alembic son código generado y declarativo: solo se excluyen
# de cobertura y duplicación (hoy están fuera de sources; la regla deja explícita
# la intención si se incorporan). main.tsx y env.d.ts son arranque y tipos del
# entorno, igual que en la exclusión de cobertura de frontend/vite.config.ts.
sonar.coverage.exclusions=backend/alembic/versions/**,frontend/src/main.tsx,frontend/src/env.d.ts
sonar.cpd.exclusions=backend/alembic/versions/**

# --- Cobertura real -------------------------------------------------------------
# Rutas donde el job de Sonar descarga los artefactos de los jobs de pruebas:
# - backend: coverage.xml de pytest-cov (job «Backend / Quality and unit»);
# - frontend: lcov.info de Vitest (job «Frontend»).
# El job normaliza las rutas a backend/app y frontend/src antes de analizar.
sonar.python.coverage.reportPaths=coverage-reports/backend/coverage.xml
sonar.javascript.lcov.reportPaths=coverage-reports/frontend/coverage/lcov.info

# El job falla si el Quality Gate no pasa, para que no quede oculto.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
