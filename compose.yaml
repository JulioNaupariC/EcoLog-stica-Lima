name: ecologistica-lima-ecl29

services:
  db:
    image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Complete POSTGRES_DB in the private root .env}
      POSTGRES_USER: ${POSTGRES_USER:?Complete POSTGRES_USER in the private root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Complete POSTGRES_PASSWORD in the private root .env}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Complete DATABASE_URL in the private root .env}
      APP_ENV: development
      DB_CONNECT_TIMEOUT: "5"
      SESSION_TTL_MINUTES: "60"
      CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:5173"]'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).close()"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgis_data:
