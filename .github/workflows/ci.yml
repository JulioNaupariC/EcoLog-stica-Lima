name: CI

on:
  workflow_dispatch:
  push:
    branches:
      # ECL-65: the SonarCloud analysis must also run on main.
      - main
      - feat/ECL-50-st024-pruebas-conductores
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs / Navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"

      - name: Check Markdown links and navigation
        run: python scripts/check_docs.py

  backend-quality:
    name: Backend / Quality and unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"

      - name: Show Python version
        run: python --version

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Install backend package
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Check backend dependencies
        run: python -m pip check

      - name: Lint backend
        run: python -m ruff check .

      - name: Check backend formatting
        run: python -m ruff format --check .

      - name: Run backend unit tests
        run: >-
          python -m pytest tests/unit -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:test-results/coverage.xml
          --junitxml=test-results/unit.xml
          --cov-fail-under=80

      - name: ST-024 driver unit coverage gate
        run: >-
          python -m pytest tests/unit/test_conductor*.py -q
          --cov=app.api.conductores --cov=app.schemas.conductor
          --cov=app.services.conductores --cov=app.repositories.conductores
          --cov-report=term-missing
          --cov-report=xml:test-results/conductores-coverage.xml
          --cov-report=html:test-results/conductores-coverage
          --junitxml=test-results/conductores-unit.xml
          --cov-fail-under=80

      - name: ST-035 load analysis coverage gate
        run: >-
          python -m pytest tests/unit/test_loadtest_analysis.py
          tests/unit/test_loadtest_evidence.py -q
          --cov=loadtest.analysis --cov=loadtest.audit --cov=loadtest.report
          --cov=loadtest.consolidate
          --cov-report=term-missing
          --cov-report=xml:test-results/load-analysis-coverage.xml
          --junitxml=test-results/load-analysis-unit.xml
          --cov-fail-under=80

      - name: Upload backend unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-results-${{ github.run_id }}
          path: backend/test-results/
          if-no-files-found: warn
          retention-days: 30

  backend-integration:
    name: Backend / Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://ecologistica_ci:ecologistica_ci@127.0.0.1:5432/ecologistica_ci
      TEST_DATABASE_URL: postgresql+psycopg://ecologistica_ci:ecologistica_ci@127.0.0.1:5432/ecologistica_ci_test
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: ecologistica_ci
          POSTGRES_PASSWORD: ecologistica_ci
          POSTGRES_DB: ecologistica_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=ecologistica_ci --dbname=ecologistica_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"

      - name: Show Python version
        run: python --version

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Install backend package
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Check backend dependencies
        run: python -m pip check

      - name: Create isolated integration database
        run: >-
          docker exec "${{ job.services.postgis.id }}"
          createdb
          --username=ecologistica_ci
          --owner=ecologistica_ci
          --template=template_postgis
          ecologistica_ci_test

      - name: Run backend integration tests
        run: >-
          python -m pytest tests/integration -q
          --junitxml=test-results/integration.xml

      - name: Upload backend integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-results-${{ github.run_id }}
          path: backend/test-results/
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false

      - name: Show npm version
        run: npm --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: >-
          npm run test:coverage -- --reporter=default --reporter=junit
          --outputFile.junit=test-results/frontend.xml

      - name: Upload frontend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/coverage/
          if-no-files-found: warn
          retention-days: 30

      - name: Build frontend
        run: npm run build

  sonarcloud:
    name: Quality / SonarCloud
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Real coverage comes from these jobs' artifacts (pytest and Vitest).
    needs:
      - backend-quality
      - frontend
    # Fork PRs never receive SONAR_TOKEN: skip the job instead of failing.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history for blame, new-code detection and PR decoration.
          fetch-depth: 0

      - name: Check SonarCloud token availability
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Only reports whether the secret exists; its value is never printed.
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN no disponible; se omite el análisis de SonarCloud."
          fi

      - name: Download backend coverage
        if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-unit-results-${{ github.run_id }}
          path: coverage-reports/backend

      - name: Download frontend coverage
        if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-test-results-${{ github.run_id }}
          path: coverage-reports/frontend

      - name: Normalize and verify coverage paths
        if: steps.token.outputs.present == 'true'
        # Reports are relative to backend/ and frontend/; Sonar reads from the
        # repository root. Fail if any covered file does not exist in the repo.
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          xml_path = "coverage-reports/backend/coverage.xml"
          lcov_path = "coverage-reports/frontend/coverage/lcov.info"
          for path in (xml_path, lcov_path):
              if not os.path.isfile(path):
                  sys.exit(f"Missing coverage report: {path}")

          xml = open(xml_path, encoding="utf-8").read()
          xml = xml.replace("<source>app</source>", "<source>backend/app</source>")
          sources = re.findall(r"<source>([^<]*)</source>", xml)
          if sources != ["backend/app"]:
              sys.exit(f"Unexpected coverage.xml sources: {sources}")
          files = re.findall(r'filename="([^"]+)"', xml)
          missing = [f for f in files if not os.path.isfile(f"backend/app/{f}")]
          rate = re.search(r'<coverage[^>]* line-rate="([0-9.]+)"', xml).group(1)
          open(xml_path, "w", encoding="utf-8").write(xml)
          print(f"backend: {len(files)} files, line-rate {float(rate):.2%}")

          lcov = open(lcov_path, encoding="utf-8").read().replace("\\", "/")
          lcov = re.sub(r"^SF:src/", "SF:frontend/src/", lcov, flags=re.M)
          covered = re.findall(r"^SF:(.+)$", lcov, flags=re.M)
          missing += [f for f in covered if not os.path.isfile(f)]
          open(lcov_path, "w", encoding="utf-8").write(lcov)
          print(f"frontend: {len(covered)} files in lcov.info")

          if not files or not covered or missing:
              sys.exit(f"Unresolvable coverage paths: {missing[:10]}")
          PY

      - name: SonarCloud scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
