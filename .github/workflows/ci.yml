name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ECL-50-st024-pruebas-conductores
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend / Quality and unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"

      - name: Show Python version
        run: python --version

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Install backend package
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Check backend dependencies
        run: python -m pip check

      - name: Lint backend
        run: python -m ruff check .

      - name: Check backend formatting
        run: python -m ruff format --check .

      - name: Run backend unit tests
        run: >-
          python -m pytest tests/unit -q
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:test-results/coverage.xml
          --junitxml=test-results/unit.xml
          --cov-fail-under=80

      - name: ST-024 driver unit coverage gate
        run: >-
          python -m pytest tests/unit/test_conductor*.py -q
          --cov=app.api.conductores --cov=app.schemas.conductor
          --cov=app.services.conductores --cov=app.repositories.conductores
          --cov-report=term-missing
          --cov-report=xml:test-results/conductores-coverage.xml
          --cov-report=html:test-results/conductores-coverage
          --junitxml=test-results/conductores-unit.xml
          --cov-fail-under=80

      - name: Upload backend unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-results-${{ github.run_id }}
          path: backend/test-results/
          if-no-files-found: warn
          retention-days: 30

  backend-integration:
    name: Backend / Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://ecologistica_ci:ecologistica_ci@127.0.0.1:5432/ecologistica_ci
      TEST_DATABASE_URL: postgresql+psycopg://ecologistica_ci:ecologistica_ci@127.0.0.1:5432/ecologistica_ci_test
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: ecologistica_ci
          POSTGRES_PASSWORD: ecologistica_ci
          POSTGRES_DB: ecologistica_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=ecologistica_ci --dbname=ecologistica_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"

      - name: Show Python version
        run: python --version

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Install backend package
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Check backend dependencies
        run: python -m pip check

      - name: Create isolated integration database
        run: >-
          docker exec "${{ job.services.postgis.id }}"
          createdb
          --username=ecologistica_ci
          --owner=ecologistica_ci
          --template=template_postgis
          ecologistica_ci_test

      - name: Run backend integration tests
        run: >-
          python -m pytest tests/integration -q
          --junitxml=test-results/integration.xml

      - name: Upload backend integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-results-${{ github.run_id }}
          path: backend/test-results/
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false

      - name: Show npm version
        run: npm --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: >-
          npm run test:coverage -- --reporter=default --reporter=junit
          --outputFile.junit=test-results/frontend.xml

      - name: Upload frontend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/coverage/
          if-no-files-found: warn
          retention-days: 30

      - name: Build frontend
        run: npm run build
