name: Green IT

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: green-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Green IT / Lighthouse desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://127.0.0.1:8000
      VITE_DEMO_ITINERARY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Public /login only, from dist via LHCI's static server (SPA fallback).
      # Authenticated pages are measured manually in ECL-108 and ECL-115.
      # Keep this check optional until DESPUES meets the rubric; do not hide failures.
      - name: Audit public login (three desktop runs)
        run: npx --no-install lhci autorun --failOnUploadFailure

      - name: Publish report links in job summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const path = '.lighthouseci/links.json';
          const links = existsSync(path) ? JSON.parse(readFileSync(path, 'utf8')) : {};
          const reports = Object.entries(links).map(([url, report]) => `- [${url}](${report})`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            ['## Lighthouse desktop — /login',
             'Three runs; assertions use the median. Authenticated pages: ECL-108/ECL-115.',
             ...reports,
             reports.length ? '' : 'No public report link was produced. Inspect the audit log and artifact.',
             'The job fails when a threshold or report upload fails; it is not a required check.',
             ''].join('\n'));
          NODE

      - name: Upload Lighthouse reports and assertions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: green-audit-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event_name }}
          path: frontend/.lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
