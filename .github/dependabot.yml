# ECL-85 (OWASP A03:2025): dependency updates for the three supply chains.
# Each proposal is an ordinary PR that goes through CI, CODEOWNERS and the
# A10/A12 rules; nothing merges automatically.
#
# Version updates are paused (open-pull-requests-limit: 0) until the sprint
# closes on 20/11/2026: the first run opened 10 PRs during the code freeze and
# the pip ones cannot pass CI, because Dependabot edits pyproject.toml but not
# the hashed requirements*.lock files. Security updates are not affected by
# this limit and still open once Dependabot alerts are enabled.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    open-pull-requests-limit: 0
