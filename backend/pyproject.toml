[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecologistica-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "pydantic>=2", "pydantic-settings", "sqlalchemy>=2", "psycopg[binary]>=3", "alembic", "argon2-cffi", "geoalchemy2==0.20.0"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx", "ruff", "pip-tools"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an explicitly configured PostgreSQL/PostGIS instance"]

[tool.coverage.run]
# ECL-65: portable coverage.xml (no absolute runner paths) so the SonarCloud job
# can map <source>app</source> to backend/app from the repository root.
relative_files = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
